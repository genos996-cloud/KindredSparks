<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邱小民社會 ｜ 教材庫存營運管理系統</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    .num-font {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    input:disabled, select:disabled {
      background-color: #f1f5f9 !important;
      color: #94a3b8 !important;
      border-color: #e2e8f0 !important;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col p-4 sm:p-6">

  <!-- 頂部標題與核心統計 -->
  <header class="max-w-6xl w-full mx-auto mb-5">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-4">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-black shadow-sm">
          <i data-lucide="book-open" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-black text-slate-900 tracking-tight">邱小民社會 ｜ 教材庫存管理</h1>
            <span class="text-xs bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded border border-indigo-200">單一部門進銷存</span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">即時狀態機運算：進貨(+)、出貨(-)、無變動(凍結)，庫存低於 10 本即時預警</p>
        </div>
      </div>

      <!-- 統計數據徽章 -->
      <div class="flex items-center gap-2">
        <div class="bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-xs flex items-center gap-2">
          <span class="text-xs font-bold text-slate-500">品項總數</span>
          <span id="stat-total-items" class="text-sm font-black text-slate-800 num-font">0</span>
        </div>
        <div class="bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg shadow-xs flex items-center gap-2">
          <span class="text-xs font-bold text-rose-700">待決策 (＜10)</span>
          <span id="stat-alert-items" class="text-sm font-black text-rose-600 num-font">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 主庫存工作表單 -->
  <main class="max-w-6xl w-full mx-auto bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden flex flex-col flex-1">
    
    <div class="overflow-x-auto w-full">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200 text-center">
            <th class="p-2.5 w-12">序</th>
            <th class="p-2.5 w-28 text-left">教材料號</th>
            <th class="p-2.5 text-left min-w-[180px]">教材品名與版本</th>
            <th class="p-2.5 w-24 text-right">目前在庫</th>
            <th class="p-2.5 w-24">異動狀態</th>
            <th class="p-2.5 w-24">異動數量</th>
            <th class="p-2.5 w-24 text-right bg-slate-50 border-x border-slate-200 font-black">結算數量</th>
            <th class="p-2.5 w-24 text-center">前次更新</th>
            <th class="p-2.5 w-24 text-center">本次更新</th>
            <th class="p-2.5 w-24 text-center">庫存狀態</th>
            <th class="p-2.5 w-16 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="inventory-tbody" class="divide-y divide-slate-100">
          <!-- 動態由 JavaScript 注入每一列 -->
        </tbody>
      </table>
    </div>

    <!-- 底部超好用一鍵新增教材按鈕 -->
    <div class="p-3 bg-slate-50 border-t border-slate-200">
      <button onclick="addNewItemRow()" 
              class="w-full py-2.5 px-4 bg-white hover:bg-indigo-50 border-2 border-dashed border-indigo-300 hover:border-indigo-500 rounded-lg text-indigo-700 font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-2xs">
        <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i>
        <span>＋ 點擊新增全新教材料號 (永久擴增)</span>
      </button>
    </div>
  </main>

  <footer class="max-w-6xl w-full mx-auto mt-3 text-right text-[11px] text-slate-400">
    時區基準：台北時間 (Asia/Taipei) ｜ 異動即時保存於本機儲存空間
  </footer>

  <script>
    const STORAGE_KEY = 'CHIU_SOCIAL_INVENTORY_DATA_v1';

    // 取得當前台北時間的 YYYY-MM-DD
    function getTaipeiDate() {
      const now = new Date();
      return now.toLocaleDateString('zh-TW', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).replace(/\//g, '-');
    }

    // 初始預設教材資料
    const defaultData = [
      {
        id: 1,
        sku: 'SOC-JH1-01',
        title: '國一社會臺灣史核心焦點',
        baseStock: 48,
        state: 'NONE',
        qty: 0,
        prevDate: '2026-09-01',
        lastDate: '2026-09-18'
      },
      {
        id: 2,
        sku: 'SOC-JH2-01',
        title: '國二社會中國史歷屆全圖解',
        baseStock: 12,
        state: 'OUT',
        qty: 4,
        prevDate: '2026-08-25',
        lastDate: '2026-09-19'
      },
      {
        id: 3,
        sku: 'SOC-JH3-CAP',
        title: '國三會考全科社會黃金素養模考本',
        baseStock: 9,
        state: 'NONE',
        qty: 0,
        prevDate: '2026-09-10',
        lastDate: '2026-09-19'
      }
    ];

    let inventory = [];

    // 載入資料
    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          inventory = JSON.parse(saved);
        } catch (e) {
          inventory = defaultData;
        }
      } else {
        inventory = defaultData;
      }
    }

    // 儲存資料
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
    }

    // 計算結餘數量
    function calcFinalStock(item) {
      const base = Number(item.baseStock) || 0;
      const q = Number(item.qty) || 0;

      if (item.state === 'IN') return base + q;
      if (item.state === 'OUT') return Math.max(0, base - q);
      return base;
    }

    // 渲染表格
    function render() {
      const tbody = document.getElementById('inventory-tbody');
      tbody.innerHTML = '';

      let alertCount = 0;

      inventory.forEach((item, index) => {
        const finalStock = calcFinalStock(item);
        const isAlert = finalStock < 10;
        if (isAlert) alertCount++;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition-colors';

        tr.innerHTML = `
          <td class="p-2 text-center text-slate-400 font-mono">${index + 1}</td>
          
          <!-- 料號 -->
          <td class="p-2">
            <input type="text" value="${item.sku || ''}" placeholder="料號"
                   onchange="updateItem(${item.id}, 'sku', this.value)"
                   class="w-full bg-transparent font-mono font-bold text-slate-800 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1.5 py-1 outline-none">
          </td>

          <!-- 品名 -->
          <td class="p-2">
            <input type="text" value="${item.title || ''}" placeholder="教材名稱"
                   onchange="updateItem(${item.id}, 'title', this.value)"
                   class="w-full bg-transparent font-medium text-slate-900 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1.5 py-1 outline-none">
          </td>

          <!-- 目前在庫 -->
          <td class="p-2 text-right">
            <input type="number" min="0" value="${item.baseStock}"
                   onchange="updateBaseStock(${item.id}, this.value)"
                   class="w-18 text-right bg-transparent font-bold text-slate-700 num-font border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 py-1 outline-none">
          </td>

          <!-- 狀態機：進 / 銷 / 無 -->
          <td class="p-2 text-center">
            <select onchange="updateState(${item.id}, this.value)"
                    class="border rounded px-2 py-1 font-bold text-xs outline-none cursor-pointer ${
                      item.state === 'IN' ? 'bg-emerald-50 border-emerald-300 text-emerald-800' :
                      item.state === 'OUT' ? 'bg-rose-50 border-rose-300 text-rose-800' :
                      'bg-slate-100 border-slate-300 text-slate-600'
                    }">
              <option value="NONE" ${item.state === 'NONE' ? 'selected' : ''}>無 (維持)</option>
              <option value="IN" ${item.state === 'IN' ? 'selected' : ''}>進 (加)</option>
              <option value="OUT" ${item.state === 'OUT' ? 'selected' : ''}>銷 (出)</option>
            </select>
          </td>

          <!-- 異動數量 -->
          <td class="p-2 text-center">
            <input type="number" min="0" value="${item.qty}"
                   ${item.state === 'NONE' ? 'disabled' : ''}
                   onchange="updateQty(${item.id}, this.value)"
                   class="w-16 text-center border border-slate-300 rounded px-1 py-1 font-bold num-font outline-none ${item.state === 'NONE' ? '' : 'bg-white focus:border-indigo-500'}">
          </td>

          <!-- 結算數量 -->
          <td class="p-2 text-right bg-slate-50 border-x border-slate-200">
            <span class="font-black text-sm num-font ${isAlert ? 'text-rose-600 font-extrabold' : 'text-slate-900'}">
              ${finalStock}
            </span>
          </td>

          <!-- 前次更新時間 -->
          <td class="p-2 text-center text-slate-400 font-mono text-[11px]">
            ${item.prevDate || '-'}
          </td>

          <!-- 本次更新時間 -->
          <td class="p-2 text-center font-mono text-[11px] font-bold text-indigo-700">
            ${item.lastDate || '-'}
          </td>

          <!-- 狀態列：正常 (綠) / 要動作 (紅) -->
          <td class="p-2 text-center">
            ${isAlert ? `
              <span class="inline-block px-2.5 py-0.5 rounded text-[11px] font-black bg-rose-100 text-rose-700 border border-rose-200">
                要動作
              </span>
            ` : `
              <span class="inline-block px-2.5 py-0.5 rounded text-[11px] font-black bg-emerald-100 text-emerald-700 border border-emerald-200">
                正常
              </span>
            `}
          </td>

          <!-- 操作：刪除 -->
          <td class="p-2 text-center">
            <button onclick="deleteRow(${item.id})" class="text-slate-400 hover:text-rose-600 p-1 rounded transition">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </td>
        `;

        tbody.appendChild(tr);
      });

      // 更新頂部統計數據
      document.getElementById('stat-total-items').textContent = inventory.length;
      document.getElementById('stat-alert-items').textContent = alertCount;

      lucide.createIcons();
    }

    // 處理日期更新記錄
    function touchDate(item) {
      const today = getTaipeiDate();
      if (item.lastDate !== today) {
        item.prevDate = item.lastDate || today;
        item.lastDate = today;
      }
    }

    // 切換狀態（進/銷/無）
    function updateState(id, newState) {
      const item = inventory.find(r => r.id === id);
      if (item) {
        touchDate(item);
        item.state = newState;
        if (newState === 'NONE') {
          item.qty = 0;
        }
        saveData();
        render();
      }
    }

    // 更新數量
    function updateQty(id, val) {
      const item = inventory.find(r => r.id === id);
      if (item) {
        touchDate(item);
        item.qty = Math.max(0, parseInt(val) || 0);
        saveData();
        render();
      }
    }

    // 更新基準庫存
    function updateBaseStock(id, val) {
      const item = inventory.find(r => r.id === id);
      if (item) {
        touchDate(item);
        item.baseStock = Math.max(0, parseInt(val) || 0);
        saveData();
        render();
      }
    }

    // 更新欄位文字（料號、品名）
    function updateItem(id, field, val) {
      const item = inventory.find(r => r.id === id);
      if (item) {
        touchDate(item);
        item[field] = val;
        saveData();
      }
    }

    // 底部按鈕：新增全新教材列
    function addNewItemRow() {
      const today = getTaipeiDate();
      const newItem = {
        id: Date.now(),
        sku: 'SOC-NEW-' + String(inventory.length + 1).padStart(2, '0'),
        title: '新教材名稱 (點擊編輯)',
        baseStock: 50,
        state: 'NONE',
        qty: 0,
        prevDate: today,
        lastDate: today
      };

      inventory.push(newItem);
      saveData();
      render();
    }

    // 刪除列
    function deleteRow(id) {
      if (confirm('確定要移除此本教材紀錄嗎？')) {
        inventory = inventory.filter(r => r.id !== id);
        saveData();
        render();
      }
    }

    // 頁面初始化
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      render();
    });
  </script>
</body>
</html>
