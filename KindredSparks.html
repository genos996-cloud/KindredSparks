<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邱小民社會 ｜ 教材庫存營運管理系統 (全寬審計版)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    .num-font {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    input:disabled, select:disabled {
      background-color: #f8fafc !important;
      color: #94a3b8 !important;
      border-color: #e2e8f0 !important;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col p-3 sm:p-4 w-full">

  <!-- 頂部全寬導覽列：登入身分 (OAuth 門神) 與全域操作 -->
  <header class="w-full mb-3 bg-white border border-slate-200 rounded-xl p-3 shadow-xs">
    <div class="w-full flex flex-col lg:flex-row items-start lg:items-center justify-between gap-3">
      
      <!-- 標題與核心定位 -->
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-black shadow-xs shrink-0">
          <i data-lucide="book-open" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight">邱小民社會 ｜ 教材進銷存營運管理</h1>
            <span class="text-xs bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded border border-indigo-200">單一部門狀態機</span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">即時狀態：進貨(+)、銷貨(-)、無變動(凍結) ｜ 異動全自動記錄「操作人員、台北時間與審計軌跡」</p>
        </div>
      </div>

      <!-- 右側：Google OAuth 登入人員切換 (示範) ＋ 批次工具 ＋ 統計 -->
      <div class="flex items-center gap-2.5 flex-wrap w-full lg:w-auto justify-start lg:justify-end">
        
        <!-- Google OAuth 當前登入者徽章 -->
        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-lg">
          <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
          <div class="text-left">
            <div class="text-[10px] text-slate-400 font-bold leading-tight">Google OAuth 認證操作員</div>
            <div class="flex items-center gap-1">
              <i data-lucide="shield-check" class="w-3.5 h-3.5 text-indigo-600"></i>
              <select id="operatorSelect" onchange="switchOperator(this.value)" 
                      class="bg-transparent text-xs font-black text-slate-800 cursor-pointer outline-none">
                <option value="邱小民 (負責人)">邱小民 (chiu.boss@gmail.com)</option>
                <option value="劉志嘉 (執行秘書)">劉志嘉 (user.liu@gmail.com)</option>
                <option value="廖灝衍 (專任教師)">廖灝衍 (user.liao@gmail.com)</option>
                <option value="行政助教 A">行政助教 A (admin.ta@gmail.com)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 頂部全域安全批次刪除按鈕 -->
        <button id="btn-batch-delete" onclick="batchDeleteSelected()" disabled
                class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all border border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span id="label-batch-delete">刪除已選教材</span>
        </button>

        <!-- 統計數據卡片 -->
        <div class="bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-2xs flex items-center gap-1.5">
          <span class="text-xs font-bold text-slate-500">品項總數：</span>
          <span id="stat-total-items" class="text-sm font-black text-slate-800 num-font">0</span>
        </div>

        <div class="bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg shadow-2xs flex items-center gap-1.5">
          <span class="text-xs font-bold text-rose-700">待決策 (＜10)：</span>
          <span id="stat-alert-items" class="text-sm font-black text-rose-600 num-font">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 主工作視窗：全螢幕滿版 (w-full) -->
  <main class="w-full bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden flex flex-col flex-1">
    <div class="overflow-x-auto w-full">
      <table class="w-full text-left text-xs border-collapse table-auto">
        <thead>
          <tr class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200 text-center">
            <!-- 全選 Checkbox -->
            <th class="p-2.5 w-10 text-center">
              <input type="checkbox" id="check-all" onchange="toggleSelectAll(this.checked)"
                     class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
            </th>
            <th class="p-2.5 w-12 text-center">序</th>
            <th class="p-2.5 text-left min-w-[280px]">教材名稱與適用學期版本</th>
            <th class="p-2.5 w-24 text-right">目前在庫</th>
            <th class="p-2.5 w-32 text-center">異動狀態</th>
            <th class="p-2.5 w-24 text-center">異動數量</th>
            <th class="p-2.5 w-28 text-right bg-slate-50 border-x border-slate-200 font-black">結算數量</th>
            <th class="p-2.5 w-24 text-center">前次更新</th>
            <th class="p-2.5 w-24 text-center">本次更新</th>
            <th class="p-2.5 min-w-[150px] text-center bg-indigo-50/40 text-indigo-950">最後異動處理人員</th>
            <th class="p-2.5 w-24 text-center">庫存狀態</th>
          </tr>
        </thead>
        <tbody id="inventory-tbody" class="divide-y divide-slate-100">
          <!-- 動態由 JavaScript 注入渲染 -->
        </tbody>
      </table>
    </div>

    <!-- 底部滿版快速擴展按鈕 -->
    <div class="p-3 bg-slate-50 border-t border-slate-200">
      <button onclick="addNewItemRow()" 
              class="w-full py-2.5 px-4 bg-white hover:bg-indigo-50 border-2 border-dashed border-indigo-300 hover:border-indigo-500 rounded-lg text-indigo-700 font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-2xs">
        <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i>
        <span>＋ 點擊新增全新教材 (系統永久列管擴充)</span>
      </button>
    </div>
  </main>

  <footer class="w-full mt-2.5 text-right text-[11px] text-slate-400">
    系統標準：全寬度流式渲染 ｜ 登入驗證：Google OAuth 2.0 ｜ 時區標準：台北時間 (Asia/Taipei)
  </footer>

  <script>
    const STORAGE_KEY = 'CHIU_SOCIAL_INVENTORY_FULL_WIDTH_v3';

    // 當前登入操作者
    let currentOperator = '邱小民 (負責人)';

    function switchOperator(op) {
      currentOperator = op;
    }

    // 取得台北時間 YYYY-MM-DD
    function getTaipeiDate() {
      const now = new Date();
      return now.toLocaleDateString('zh-TW', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).replace(/\//g, '-');
    }

    // 預設資料 (包含 operator 欄位)
    const defaultData = [
      {
        id: 1,
        title: '國一社會臺灣史核心焦點',
        baseStock: 48,
        state: 'NONE',
        qty: 0,
        prevDate: '2026-09-01',
        lastDate: '2026-09-18',
        operator: '邱小民 (負責人)'
      },
      {
        id: 2,
        title: '國二社會中國史歷屆全圖解',
        baseStock: 12,
        state: 'OUT',
        qty: 4,
        prevDate: '2026-08-25',
        lastDate: '2026-09-19',
        operator: '劉志嘉 (執行秘書)'
      },
      {
        id: 3,
        title: '國三會考全科社會黃金素養模考本',
        baseStock: 9,
        state: 'NONE',
        qty: 0,
        prevDate: '2026-09-10',
        lastDate: '2026-09-19',
        operator: '行政助教 A'
      }
    ];

    let inventory = [];
    let selectedIds = new Set();

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          inventory = JSON.parse(saved);
        } catch (e) {
          inventory = defaultData;
        }
      } else {
        inventory = defaultData;
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
    }

    function calcFinalStock(item) {
      const base = Number(item.baseStock) || 0;
      const q = Number(item.qty) || 0;

      if (item.state === 'IN') return base + q;
      if (item.state === 'OUT') return Math.max(0, base - q);
      return base;
    }

    // 記錄時間與操作者
    function touchAudit(item) {
      const today = getTaipeiDate();
      if (item.lastDate !== today) {
        item.prevDate = item.lastDate || today;
        item.lastDate = today;
      }
      item.operator = currentOperator;
    }

    function render() {
      const tbody = document.getElementById('inventory-tbody');
      tbody.innerHTML = '';

      let alertCount = 0;

      inventory.forEach((item, index) => {
        const finalStock = calcFinalStock(item);
        const isAlert = finalStock < 10;
        if (isAlert) alertCount++;

        const isChecked = selectedIds.has(item.id);
        const tr = document.createElement('tr');
        tr.className = `hover:bg-slate-50/80 transition-colors ${isChecked ? 'bg-indigo-50/30' : ''}`;

        tr.innerHTML = `
          <!-- Checkbox -->
          <td class="p-2.5 text-center">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSelect(${item.id}, this.checked)"
                   class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
          </td>

          <!-- 序號 -->
          <td class="p-2.5 text-center text-slate-400 font-mono">${index + 1}</td>

          <!-- 教材名稱 (無料號干擾，超寬可讀空間) -->
          <td class="p-2.5">
            <input type="text" value="${item.title || ''}" placeholder="請輸入教材名稱與適用版本"
                   onchange="updateItemTitle(${item.id}, this.value)"
                   class="w-full bg-transparent font-bold text-slate-900 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-2 py-1 outline-none text-xs">
          </td>

          <!-- 目前在庫 -->
          <td class="p-2.5 text-right">
            <input type="number" min="0" value="${item.baseStock}"
                   onchange="updateBaseStock(${item.id}, this.value)"
                   class="w-20 text-right bg-transparent font-bold text-slate-700 num-font border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1.5 py-1 outline-none text-xs">
          </td>

          <!-- 狀態機：進 / 銷 / 無 -->
          <td class="p-2.5 text-center">
            <select onchange="updateState(${item.id}, this.value)"
                    class="border rounded px-2.5 py-1 font-bold text-xs outline-none cursor-pointer ${
                      item.state === 'IN' ? 'bg-emerald-50 border-emerald-300 text-emerald-800' :
                      item.state === 'OUT' ? 'bg-rose-50 border-rose-300 text-rose-800' :
                      'bg-slate-100 border-slate-300 text-slate-600'
                    }">
              <option value="NONE" ${item.state === 'NONE' ? 'selected' : ''}>無 (維持)</option>
              <option value="IN" ${item.state === 'IN' ? 'selected' : ''}>進 (加 +)</option>
              <option value="OUT" ${item.state === 'OUT' ? 'selected' : ''}>銷 (出 -)</option>
            </select>
          </td>

          <!-- 異動數量 -->
          <td class="p-2.5 text-center">
            <input type="number" min="0" value="${item.qty}"
                   ${item.state === 'NONE' ? 'disabled' : ''}
                   onchange="updateQty(${item.id}, this.value)"
                   class="w-20 text-center border border-slate-300 rounded px-1.5 py-1 font-bold num-font outline-none text-xs ${item.state === 'NONE' ? '' : 'bg-white focus:border-indigo-500'}">
          </td>

          <!-- 結算數量 -->
          <td class="p-2.5 text-right bg-slate-50 border-x border-slate-200">
            <span class="font-black text-sm num-font ${isAlert ? 'text-rose-600' : 'text-slate-900'}">
              ${finalStock}
            </span>
          </td>

          <!-- 前次更新 -->
          <td class="p-2.5 text-center text-slate-400 font-mono text-[11px]">
            ${item.prevDate || '-'}
          </td>

          <!-- 本次更新 -->
          <td class="p-2.5 text-center font-mono text-[11px] font-bold text-indigo-700">
            ${item.lastDate || '-'}
          </td>

          <!-- 誰更新的 (審計人員標記) -->
          <td class="p-2.5 text-center bg-indigo-50/20">
            <span class="inline-flex items-center gap-1 font-bold text-[11px] text-slate-700 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">
              <i data-lucide="user" class="w-3 h-3 text-indigo-500"></i>
              ${item.operator || '系統預設'}
            </span>
          </td>

          <!-- 狀態列：正常 (綠) / 要動作 (紅) -->
          <td class="p-2.5 text-center">
            ${isAlert ? `
              <span class="inline-block px-2.5 py-0.5 rounded text-[11px] font-black bg-rose-100 text-rose-700 border border-rose-200">
                不夠了
              </span>
            ` : `
              <span class="inline-block px-2.5 py-0.5 rounded text-[11px] font-black bg-emerald-100 text-emerald-700 border border-emerald-200">
                正常
              </span>
            `}
          </td>
        `;

        tbody.appendChild(tr);
      });

      document.getElementById('stat-total-items').textContent = inventory.length;
      document.getElementById('stat-alert-items').textContent = alertCount;

      updateBatchUI();
      lucide.createIcons();
    }

    function toggleSelect(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      render();
    }

    function toggleSelectAll(checked) {
      if (checked) {
        inventory.forEach(item => selectedIds.add(item.id));
      } else {
        selectedIds.clear();
      }
      render();
    }

    function updateBatchUI() {
      const btn = document.getElementById('btn-batch-delete');
      const label = document.getElementById('label-batch-delete');
      const checkAll = document.getElementById('check-all');
      const count = selectedIds.size;

      if (count > 0) {
        btn.disabled = false;
        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all border border-rose-300 bg-rose-600 hover:bg-rose-700 text-white cursor-pointer shadow-2xs';
        label.textContent = `刪除已選 (${count} 筆)`;
      } else {
        btn.disabled = true;
        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all border border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed';
        label.textContent = '刪除已選教材';
      }

      checkAll.checked = inventory.length > 0 && selectedIds.size === inventory.length;
    }

    function batchDeleteSelected() {
      if (selectedIds.size === 0) return;
      if (confirm(`【審計警示】確定要由【${currentOperator}】授權刪除選取的 ${selectedIds.size} 筆教材嗎？`)) {
        inventory = inventory.filter(item => !selectedIds.has(item.id));
        selectedIds.clear();
        saveData();
        render();
      }
    }

    function updateState(id, newState) {
      const item = inventory.find(r => r.id === id);
      if (item) {
        touchAudit(item);
        item.state = newState;
        if (newState === 'NONE') item.qty = 0;
        saveData();
        render();
      }
    }

    function updateQty(id, val) {
      const item = inventory.find(r => r.id === id);
      if (item) {
        touchAudit(item);
        item.qty = Math.max(0, parseInt(val) || 0);
        saveData();
        render();
      }
    }

    function updateBaseStock(id, val) {
      const item = inventory.find(r => r.id === id);
      if (item) {
        touchAudit(item);
        item.baseStock = Math.max(0, parseInt(val) || 0);
        saveData();
        render();
      }
    }

    function updateItemTitle(id, val) {
      const item = inventory.find(r => r.id === id);
      if (item) {
        touchAudit(item);
        item.title = val;
        saveData();
        render();
      }
    }

    function addNewItemRow() {
      const today = getTaipeiDate();
      const newItem = {
        id: Date.now(),
        title: '新教材名稱 (點擊直接編輯)',
        baseStock: 50,
        state: 'NONE',
        qty: 0,
        prevDate: today,
        lastDate: today,
        operator: currentOperator
      };

      inventory.push(newItem);
      saveData();
      render();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      render();
    });
  </script>
</body>
</html>
