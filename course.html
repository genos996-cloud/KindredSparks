    <script>
        // ================= 1. Supabase 雲端連線 =================
        const supabaseUrl = 'https://dlzcbybmsckhiocbcmvm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsemNieWJtc2NraGlvY2JjbXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTU0MjQsImV4cCI6MjA5NjQ5MTQyNH0.pn2gwkLrUWgc19Gh6W9VOe52SAP4mjKMAfvVZGmoUiU'; 
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUserApp = ""; 
        let currentUserRole = "pending";
        let currentUserId = ""; 
        let isPersonalView = false; // 兼職 (part_time) 與外聘專屬隔離視角

        // ================= 2. 八周變形工時與節假日引擎 =================
        const holidays2026 = [
            "2026-01-01", "2026-02-15", "2026-02-16", "2026-02-17",
            "2026-02-18", "2026-02-19", "2026-02-28", "2026-04-04",
            "2026-04-05", "2026-05-01", "2026-06-19", "2026-09-25",
            "2026-09-28", "2026-10-10", "2026-10-25", "2026-12-25"
        ];

        function getIndividual8WeekPeriod(currentDateStr, startDateStr) {
            if (!startDateStr || startDateStr.trim() === '') return null;
            const startEpoch = new Date(startDateStr + 'T00:00:00');
            const target = new Date(currentDateStr + 'T00:00:00');
            if (target < startEpoch) return null; 

            const diffDays = Math.floor((target - startEpoch) / (1000 * 60 * 60 * 24));
            const cycleIndex = Math.floor(diffDays / 56);
            const cycleStart = new Date(startEpoch.getTime() + cycleIndex * 56 * 24 * 60 * 60 * 1000);
            const cycleEnd = new Date(cycleStart.getTime() + 55 * 24 * 60 * 60 * 1000);

            const startStr = `${String(cycleStart.getMonth() + 1).padStart(2, '0')}/${String(cycleStart.getDate()).padStart(2, '0')}`;
            const endStr = `${String(cycleEnd.getMonth() + 1).padStart(2, '0')}/${String(cycleEnd.getDate()).padStart(2, '0')}`;

            let holidayCount = 0;
            holidays2026.forEach(h => {
                const hDate = new Date(h + 'T00:00:00');
                if (hDate >= cycleStart && hDate <= cycleEnd) holidayCount++;
            });

            return { start: cycleStart, end: cycleEnd, startStr, endStr, maxRestDays: 16 + holidayCount };
        }

        function getLeaveStats(tId, periodStart, periodEnd) {
            let statDays = 0, spec = 0, sick = 0, pers = 0;
            let countedFullDayDates = { stat: new Set(), spec: new Set(), sick: new Set(), pers: new Set() };
            const currentYear = getTaiwanDateObj().getFullYear();

            Object.keys(db).forEach(key => {
                const [dateStr, loopTId] = key.split('_'); 
                if(loopTId !== tId) return; 
                const rDate = new Date(dateStr + 'T00:00:00');
                
                db[key].forEach(r => {
                    if(r.status === 'active' && r.type === 'leave') {
                        const isFull = !r.exactTime;
                        const isCSVHalf = isFull && (r.desc === '休' || r.desc === '例' || (r.reason && r.reason.includes('CSV')));
                        
                        let daysToAdd = 0;
                        if (!isFull) {
                            daysToAdd = calcLeaveDays(r.exactTime);
                        } else if (isCSVHalf) {
                            daysToAdd = 0.5;
                        }

                        if ((r.desc === '排休' || r.desc === '休' || r.desc === '例') && periodStart && periodEnd && rDate >= periodStart && rDate <= periodEnd) {
                            if (isFull && !isCSVHalf) {
                                if(!countedFullDayDates.stat.has(dateStr)) { statDays += 1; countedFullDayDates.stat.add(dateStr); }
                            } else {
                                statDays += daysToAdd;
                            }
                        }
                        
                        if (rDate.getFullYear() === currentYear) {
                            if (r.desc.includes('特休')) {
                                if (isFull && !isCSVHalf) { if(!countedFullDayDates.spec.has(dateStr)) { spec += 1; countedFullDayDates.spec.add(dateStr); } } else spec += daysToAdd;
                            }
                            if (r.desc.includes('病假')) {
                                if (isFull && !isCSVHalf) { if(!countedFullDayDates.sick.has(dateStr)) { sick += 1; countedFullDayDates.sick.add(dateStr); } } else sick += daysToAdd;
                            }
                            if (r.desc.includes('事假')) {
                                if (isFull && !isCSVHalf) { if(!countedFullDayDates.pers.has(dateStr)) { pers += 1; countedFullDayDates.pers.add(dateStr); } } else pers += daysToAdd;
                            }
                        }
                    }
                });
            });
            return { statDays, spec, sick, pers };
        }

        function getTaiwanDateObj() { const tzStr = new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }); return new Date(tzStr); }
        function getTaiwanTimeStr() { const d = getTaiwanDateObj(); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
        function calcLeaveDays(ex) { if(!ex) return 1/6; const [s,e]=ex.split('-'); const [sh,sm]=s.split(':').map(Number), [eh,em]=e.split(':').map(Number); return ((eh+em/60)-(sh+sm/60))/8; }
        function calcHoursFromTimeStr(ex) { if(!ex) return 0; const [s,e]=ex.split('-'); const [sh,sm]=s.split(':').map(Number), [eh,em]=e.split(':').map(Number); return (eh+em/60)-(sh+sm/60); }
        function formatQuota(u, t) { let us = u%1===0?u:u.toFixed(2); if(String(us).endsWith('.00')) us=Math.round(u); return `(${us}/${t})`; }
        function calcLsaAnnualLeave(startDateStr) {
            if (!startDateStr || startDateStr.trim() === '') return 0;
            const start = new Date(startDateStr + 'T00:00:00'), now = getTaiwanDateObj();
            let m = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
            if (now.getDate() < start.getDate()) m--;
            if (m < 6) return 0; if (m < 12) return 3;
            let y = Math.floor(m / 12);
            if (y < 2) return 7; if (y < 3) return 10; if (y < 5) return 14; if (y < 10) return 15;
            return Math.min(15 + (y - 9), 30);
        }

    <script>
        // ================= 前端共用與日期美化邏輯 =================
        function updateDateDisplay() {
            const d = new Date(state.date);
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const dayOfWeek = days[d.getDay()];
            document.getElementById('dateDisplay').innerText = `${year}年${month}月${day}日 (${dayOfWeek})`;
        }

        function changeDate(offset) { let d = new Date(state.date); d.setDate(d.getDate() + offset); state.date = d.toISOString().split('T')[0]; document.getElementById('currentDate').value = state.date; updateDateDisplay(); renderGrid(); }
        function goToToday() { state.date = getTaiwanDateObj().toISOString().split('T')[0]; document.getElementById('currentDate').value = state.date; updateDateDisplay(); renderGrid(); }
        document.getElementById('currentDate').addEventListener('change', (e) => { state.date = e.target.value; updateDateDisplay(); renderGrid(); });

        function generateTimeOptions() { let ops = ''; for(let h=8; h<=22; h++) { let hs = h.toString().padStart(2, '0'); ops += `<option value="${hs}:00">${hs}:00</option>`; if(h !== 22) ops += `<option value="${hs}:30">${hs}:30</option>`; } return ops; }
        const timeOps = generateTimeOptions(); document.getElementById('schStartTime').innerHTML = timeOps; document.getElementById('schEndTime').innerHTML = timeOps; document.getElementById('levStartTime').innerHTML = timeOps; document.getElementById('levEndTime').innerHTML = timeOps;

        function checkTimeConflict(date, tId, block, newStart, newEnd, ignoreId = null) {
            const records = db[`${date}_${tId}_${block}`] || [];
            for (let r of records) { 
                if (r.status === 'active' && r.id !== ignoreId) { 
                    if(r.type === 'leave' && !r.exactTime) return r; 
                    if(r.exactTime) { 
                        const [rStart, rEnd] = r.exactTime.split('-'); 
                        if (newStart < rEnd && rStart < newEnd) return r; 
                    } 
                } 
            } 
            return null;
        }

        // ================= CSV 批次多檔與狀態同步匯入引擎 =================
        function triggerCSVUpload() {
            document.getElementById('csvFileInput').click();
        }

        function handleCSVUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            document.getElementById('loadingOverlay').classList.remove('hidden');
            let processedCount = 0;
            let totalEventsToInsert = [];
            let totalHistoryToInsert = [];
            let affectedKeys = new Set();
            const currentTime = getTaiwanTimeStr();

            Array.from(files).forEach((file) => {
                Papa.parse(file, {
                    complete: async function(results) {
                        try {
                            const data = results.data;
                            let dateCols = [];

                            for (let r = 0; r < data.length; r++) {
                                const row = data[r];
                                if (!row) continue;

                                let isHeaderRow = false;
                                for (let c = 0; c < row.length; c++) {
                                    const cellStr = String(row[c]).trim();
                                    const match = cellStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
                                    if (match) { isHeaderRow = true; break; }
                                }

                                if (isHeaderRow) {
                                    dateCols = [];
                                    for (let c = 0; c < row.length; c++) {
                                        const match = String(row[c]).match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
                                        if (match) {
                                            const y = match[1], m = match[2].padStart(2, '0'), d = match[3].padStart(2, '0');
                                            dateCols.push({ index: c, dateStr: `${y}-${m}-${d}` });
                                        }
                                    }
                                    continue; 
                                }

                                if (dateCols.length > 0 && row.length >= 2) {
                                    const rawBlock = String(row[0]).trim();
                                    let block = "上午";
                                    if (rawBlock.includes("下午")) block = "下午";
                                    else if (rawBlock.includes("晚上")) block = "晚上";

                                    const teacherName = String(row[1]).trim();
                                    if (!teacherName) continue;

                                    const teacher = teachers.find(t => t.name === teacherName);
                                    if (!teacher) {
                                        console.warn(`找不到老師，跳過此列：${teacherName}`);
                                        continue; 
                                    }

                                    for (let dInfo of dateCols) {
                                        let cellValue = row[dInfo.index];
                                        if (!cellValue || String(cellValue).trim() === '') continue;
                                        cellValue = String(cellValue).trim();
                                        
                                        affectedKeys.add(`${dInfo.dateStr}_${teacher.id}_${block}`);
                                        
                                        let type = "class", reason = "", exact_time = "", descText = cellValue;

                                        if (cellValue === "休" || cellValue === "例" || cellValue.includes("請假")) {
                                            type = "leave"; 
                                            reason = "由 CSV 自動匯入標記";
                                        }

                                        const uniqueId = 'evt_csv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                                        
                                        totalEventsToInsert.push({
                                            id: uniqueId, date: dInfo.dateStr, teacher_id: teacher.id, block: block, 
                                            type: type, exact_time: exact_time, desc_text: descText, reason: reason, status: 'active'
                                        });

                                        totalHistoryToInsert.push({
                                            event_id: uniqueId, action: '建立', timestamp: currentTime, 
                                            user_name: currentUserApp, details: `透過 CSV 批次匯入自動建立：\n${cellValue}`
                                        });
                                    }
                                }
                            }
                        } catch (err) { console.error("解析錯誤:", err); }

                        processedCount++;
                        
                        if (processedCount === files.length) {
                            if (totalEventsToInsert.length > 0) {
                                const batchSize = 50; 
                                let idsToCancel = [];
                                let historyToCancel = [];
                                
                                affectedKeys.forEach(key => {
                                    if (db[key]) {
                                        db[key].forEach(existingEvent => {
                                            if (existingEvent.status === 'active') {
                                                idsToCancel.push(existingEvent.id);
                                                historyToCancel.push({
                                                    event_id: existingEvent.id,
                                                    action: '清除',
                                                    timestamp: currentTime,
                                                    user_name: currentUserApp,
                                                    details: 'CSV 批次匯入狀態同步：自動清除重疊舊紀錄'
                                                });
                                            }
                                        });
                                    }
                                });

                                if (idsToCancel.length > 0) {
                                    for (let i = 0; i < idsToCancel.length; i += batchSize) {
                                        await supabaseClient.from('events').update({ status: 'cancelled' }).in('id', idsToCancel.slice(i, i + batchSize));
                                    }
                                    for (let i = 0; i < historyToCancel.length; i += batchSize) {
                                        await supabaseClient.from('event_history').insert(historyToCancel.slice(i, i + batchSize));
                                    }
                                }

                                for (let i = 0; i < totalEventsToInsert.length; i += batchSize) {
                                    await supabaseClient.from('events').upsert(totalEventsToInsert.slice(i, i + batchSize));
                                    await supabaseClient.from('event_history').insert(totalHistoryToInsert.slice(i, i + batchSize));
                                }

                                alert(`✅ 狀態同步完畢！成功清除舊紀錄，並匯入 ${totalEventsToInsert.length} 筆最新排班資料！`);
                                await loadDataFromDB();
                            } else {
                                alert("沒有解析到任何有效的排班資料，請確認格式或老師名稱是否正確。");
                                document.getElementById('loadingOverlay').classList.add('hidden');
                            }
                            event.target.value = ''; 
                        }
                    }
                });
            });
        }

        // ================= 應用狀態與權限防護 =================
        const timeBlocks = ['上午', '下午', '晚上'];
        let teachers = []; let db = {}; let state = { date: new Date().toISOString().split('T')[0], selectedTarget: { tId: null, block: null, currentType: null }, inputMode: 'class', editTarget: { key: null, eventId: null } };
        
        document.getElementById('currentDate').value = state.date;
        updateDateDisplay();

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const user = session.user; currentUserApp = user.user_metadata.full_name || user.email.split('@')[0];
                currentUserId = user.id; 
                
                const { data: dbUser } = await supabaseClient.from('users').select('*').eq('id', user.id).maybeSingle();
                
                if (!dbUser) { 
                    const { count } = await supabaseClient.from('users').select('*', { count: 'exact', head: true });
                    const assignedRole = (count === 0) ? 'admin' : 'pending';
                    await supabaseClient.from('users').insert({ id: user.id, email: user.email, name: currentUserApp, role: assignedRole });
                    currentUserRole = assignedRole; 
                } else { currentUserRole = dbUser.role; }

                if (currentUserRole === 'pending' || currentUserRole === 'rejected') {
                    document.getElementById('loginSection').classList.add('hidden'); document.getElementById('pendingSection').classList.remove('hidden');
                } else {
                    document.getElementById('authScreen').classList.add('hidden'); document.getElementById('appScreen').classList.remove('hidden');
                    document.querySelectorAll('.script-user-name').forEach(el => el.innerText = dbUser ? dbUser.name : currentUserApp);
                    const roleBadge = document.getElementById('userRoleBadge');
                    if(roleBadge) { roleBadge.innerText = currentUserRole === 'admin' ? '管理員' : '一般使用者'; roleBadge.className = currentUserRole === 'admin' ? "ml-1 px-2 py-0.5 bg-indigo-100 text-indigo-700 font-bold rounded-md text-[10px]" : "ml-1 px-2 py-0.5 bg-slate-200 text-slate-600 font-bold rounded-md text-[10px]"; }
                    const adminPanel = document.getElementById('adminActionButtons');
                    if (adminPanel) { if (currentUserRole === 'admin') { adminPanel.classList.remove('hidden'); adminPanel.classList.add('flex'); } else { adminPanel.classList.add('hidden'); adminPanel.classList.remove('flex'); } }
                    
                    await loadDataFromDB();
                }
            } else { document.getElementById('appScreen').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); document.getElementById('loginSection').classList.remove('hidden'); document.getElementById('pendingSection').classList.add('hidden'); }
        });

        async function handleGoogleOAuth() { await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
        async function handleSystemLogout() { await supabaseClient.auth.signOut(); }

        // ================= 資料庫讀取引擎 (兼職 part_time 隔離邏輯) =================
        async function loadDataFromDB() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            const { data: tData } = await supabaseClient.from('teachers').select('*'); 
            let rawTeachers = tData || [];
            
            rawTeachers.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric: true}));
            
            // 抓出登入者在 teachers 表中的資料
            const myProfile = rawTeachers.find(t => t.id === currentUserId);
            
            // 兼職 (part_time) 與外聘 (external) 啟動隔離結界，只看見自己
            isPersonalView = (myProfile && (myProfile.type === 'part_time' || myProfile.type === 'external'));
            
            if (isPersonalView) {
                rawTeachers = rawTeachers.filter(t => t.id === currentUserId);
            }

            teachers = rawTeachers.map(t => ({ id: t.id, name: t.name, type: t.type, startDate: t.start_date, hourlyRate: t.hourly_rate }));

            const today = new Date();
            const prevMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
            const nextMonth = new Date(today.getFullYear(), today.getMonth() + 2, 0); 
            const offset = prevMonth.getTimezoneOffset() * 60000;
            const startDateStr = new Date(prevMonth - offset).toISOString().split('T')[0];
            const endDateStr = new Date(nextMonth - offset).toISOString().split('T')[0];

            const { data: eData } = await supabaseClient
                .from('events')
                .select('*')
                .gte('date', startDateStr)
                .lte('date', endDateStr)
                .limit(5000);

            const { data: hData } = await supabaseClient
                .from('event_history')
                .select('*')
                .order('timestamp', { ascending: true })
                .limit(5000);

            db = {};
            if (eData) {
                eData.forEach(e => {
                    const key = `${e.date}_${e.teacher_id}_${e.block}`; if (!db[key]) db[key] = [];
                    e.exactTime = e.exact_time; e.desc = e.desc_text;
                    e.history = hData ? hData.filter(h => h.event_id === e.id).map(h => ({ action: h.action, timestamp: h.timestamp, user: h.user_name, details: h.details })) : [];
                    db[key].push(e);
                });
            }
            document.getElementById('loadingOverlay').classList.add('hidden'); renderGrid();
        }

        async function quickRename(userId, currentName) {
            const newName = prompt("請輸入該員工的正確系統顯示名稱：", currentName);
            if (newName && newName.trim() !== "" && newName !== currentName) {
                document.getElementById('loadingOverlay').classList.remove('hidden');

                await supabaseClient.from('users').update({ name: cleanName }).eq('id', userId);

        async function changeUserRole(userId, newRole, userName) {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            
            // 1. 更新 users 資料表身分
            await supabaseClient.from('users').update({ role: newRole }).eq('id', userId);
            
            // 2. 對接 teachers 資料表，確保兼職/內部對應相應的排課模式
            if (newRole === 'user' || newRole === 'admin' || newRole === 'part_time') {
                const { data: existTeacher } = await supabaseClient.from('teachers').select('*').eq('id', userId).maybeSingle();
                
                const teacherType = (newRole === 'part_time') ? 'part_time' : 'fulltime';

                if (!existTeacher) {
                    await supabaseClient.from('teachers').insert({
                        id: userId,
                        name: userName || '未命名',
                        type: teacherType,
                        start_date: new Date().toISOString().split('T')[0],
                        hourly_rate: (newRole === 'part_time' ? 200 : 0)
                    });
                } else {
                    await supabaseClient.from('teachers').update({ type: teacherType }).eq('id', userId);
                }
            }
            
            if (userId === currentUserId) {
                currentUserRole = newRole;
            }

            await loadDataFromDB();
            openUserApprovalModal();
        }

        async function saveData() {
            document.getElementById('btnSaveData').innerText = "雲端寫入中...";
            const date = state.date, tId = state.selectedTarget.tId, block = state.selectedTarget.block, currentTime = getTaiwanTimeStr();
            const isEdit = state.editTarget.eventId !== null, uniqueId = isEdit ? state.editTarget.eventId : 'evt_' + Date.now();
            let payload = { id: uniqueId, date: date, teacher_id: tId, block: block, status: 'active' };
            let logDetails = '';

            if (state.inputMode === 'class') {
                const startT = document.getElementById('schStartTime').value, endT = document.getElementById('schEndTime').value;
                const descText = document.getElementById('schDescText').value.trim();
                
                if(!descText) {
                    document.getElementById('btnSaveData').innerText = "寫入資料庫";
                    return alert('請填寫課程名稱！'); 
                }
                if(startT >= endT) {
                    document.getElementById('btnSaveData').innerText = "寫入資料庫";
                    return alert('結束時間必須晚於開始時間！');
                }
                if (checkTimeConflict(date, tId, block, startT, endT, isEdit ? uniqueId : null)) {
                    document.getElementById('btnSaveData').innerText = "寫入資料庫";
                    return alert(`衝堂警告！與已排紀錄重疊。`);
                }
                
                payload = { ...payload, type: 'class', exact_time: `${startT}-${endT}`, desc_text: descText, reason: '' };
                logDetails = isEdit ? `更新排課。\n新: ${descText} [${startT}-${endT}]` : `新增排課：${descText} [${startT}-${endT}]`;
            } else {
                const cleanType = document.getElementById('levType').value.substring(0, 2), reason = document.getElementById('levReason').value.trim(), isFullDay = document.getElementById('levIsFullDay').checked;
                let exactT = ''; 
                if(!isFullDay) { 
                    const s = document.getElementById('levStartTime').value, e = document.getElementById('levEndTime').value; 
                    if(s >= e) {
                        document.getElementById('btnSaveData').innerText = "寫入資料庫";
                        return alert('休假結束時間必須晚於開始時間！'); 
                    }
                    exactT = `${s}-${e}`; 
                }
                if(!reason) {
                    document.getElementById('btnSaveData').innerText = "寫入資料庫";
                    return alert('休假必須填寫事由！');
                }
                if(cleanType === '病假' && !document.getElementById('sickLeaveProof').checked) {
                    document.getElementById('btnSaveData').innerText = "寫入資料庫";
                    return alert('【病假申請失敗】\n請確認您已上傳醫生證明文件！');
                }
                if (checkTimeConflict(date, tId, block, exactT ? exactT.split('-')[0] : '00:00', exactT ? exactT.split('-')[1] : '23:59', isEdit ? uniqueId : null)) {
                    document.getElementById('btnSaveData').innerText = "寫入資料庫";
                    return alert(`衝堂警告！該時段已有紀錄。`);
                }

                payload = { ...payload, type: 'leave', exact_time: exactT, desc_text: cleanType, reason: reason };
                logDetails = isEdit ? `更新休假。類別: ${cleanType}, 時段: ${exactT || '全日'}` : `設定休假 (${cleanType}) [${exactT || '全日'}]。事由：${reason}`;
                
                if (!isEdit && isFullDay) {
                    let baseId = 'evt_' + Date.now();
                    for(let i=0; i<timeBlocks.length; i++) {
                        let blockId = baseId + '_' + i;
                        await supabaseClient.from('events').insert({ ...payload, id: blockId, block: timeBlocks[i] });
                        await supabaseClient.from('event_history').insert({ event_id: blockId, action: '建立', timestamp: currentTime, user_name: currentUserApp, details: logDetails });
                    }
                    closeInputModal(); await loadDataFromDB(); return;
                }
            }

            await supabaseClient.from('events').upsert(payload);
            await supabaseClient.from('event_history').insert({ event_id: uniqueId, action: isEdit ? '變更' : '建立', timestamp: currentTime, user_name: currentUserApp, details: logDetails });
            closeInputModal(); await loadDataFromDB();
        }

        // ================= 歷程面板 =================
        function openHistoryModal(key, eventId, eventObj) {
            if (isPersonalView) return; 
            if(eventObj) eventObj.stopPropagation(); 
            const data = db[key].find(r => r.id === eventId); const [dateStr, tId] = key.split('_'); const teacher = teachers.find(t => t.id === tId);
            document.getElementById('histTitle').innerText = `資料歷程：${teacher.name}`; document.getElementById('histSubtitle').innerText = `${dateStr} | ${data.desc}`;
            const timeline = document.getElementById('histTimeline'); timeline.innerHTML = '';
            
            [...data.history].reverse().forEach(log => {
                let badgeColor = log.action === '變更' ? 'bg-indigo-100 text-indigo-700' : (log.action === '清除' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700');
                timeline.innerHTML += `<div class="timeline-item relative pb-6"><div class="font-bold text-slate-800 text-sm flex items-center gap-2"><span class="${badgeColor} px-2 py-0.5 rounded text-[11px] shadow-sm tracking-widest uppercase">${log.action}</span><span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 tracking-wider">${log.timestamp}</span></div><div class="text-[10px] text-indigo-500 font-bold mt-2 uppercase tracking-widest">操作者：${log.user}</div><div class="text-sm text-slate-600 mt-1.5 bg-slate-50/50 p-3 rounded-xl border border-slate-100 shadow-inner whitespace-pre-wrap font-medium leading-relaxed">${log.details}</div></div>`;
            });

            document.getElementById('histActionButtons').style.display = 'flex';
            const btnEdit = document.getElementById('btnEditRecord'), btnDel = document.getElementById('btnDeleteRecord');
            if (data.status === 'cancelled') { btnEdit.style.display = 'none'; btnDel.style.display = 'none'; } 
            else { btnEdit.style.display = 'block'; btnDel.style.display = 'block'; btnEdit.onclick = () => openEditModal(key, eventId); }

            btnDel.onclick = async () => {
                if(confirm(`確定要清除這筆紀錄嗎？\n(將同步更新至雲端資料庫)`)) {
                    document.getElementById('modalHistory').classList.add('hidden'); document.getElementById('loadingOverlay').classList.remove('hidden');
                    const currentTime = getTaiwanTimeStr();
                    if(data.type === 'leave' && !data.exactTime) {
                        for(let b of timeBlocks) {
                            const bRecords = db[`${dateStr}_${tId}_${b}`]; if(!bRecords) continue;
                            const tLeave = bRecords.find(r => r.type==='leave' && !r.exactTime);
                            if(tLeave && tLeave.status !== 'cancelled') {
                                await supabaseClient.from('events').update({ status: 'cancelled' }).eq('id', tLeave.id);
                                await supabaseClient.from('event_history').insert({ event_id: tLeave.id, action: '清除', timestamp: currentTime, user_name: currentUserApp, details: '清除/取消全日休假' });
                            }
                        }
                    } else { 
                        await supabaseClient.from('events').update({ status: 'cancelled' }).eq('id', data.id);
                        await supabaseClient.from('event_history').insert({ event_id: data.id, action: '清除', timestamp: currentTime, user_name: currentUserApp, details: '清除單筆紀錄' });
                    }
                    await loadDataFromDB();
                }
            };
            document.getElementById('modalHistory').classList.remove('hidden');
        }

        function openCellHistoryModal(key) {
            closeInputModal(); const records = db[key] || []; if(records.length === 0) return;
            const [dateStr, tId, block] = key.split('_'); const teacher = teachers.find(t => t.id === tId);
            document.getElementById('histTitle').innerText = `格位異動總表：${teacher.name}`; document.getElementById('histSubtitle').innerText = `${dateStr} ${block}`;
            const timeline = document.getElementById('histTimeline'); timeline.innerHTML = '';
            let allLogs = []; records.forEach(r => { r.history.forEach(log => { allLogs.push({ ...log, eventDesc: r.desc, eventStatus: r.status }); }); });
            allLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            allLogs.forEach(log => {
                let badgeColor = log.action === '變更' ? 'bg-indigo-100 text-indigo-700' : (log.action === '清除' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700');
                timeline.innerHTML += `<div class="timeline-item relative pb-6"><div class="font-bold text-slate-800 text-sm flex items-center gap-2"><span class="${badgeColor} px-2 py-0.5 rounded text-[11px] shadow-sm tracking-widest uppercase">${log.action}</span><span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 tracking-wider">${log.timestamp}</span></div><div class="text-[10px] text-indigo-500 font-bold mt-2 uppercase tracking-widest">操作者：${log.user}</div><div class="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-widest">標的：${log.eventDesc}</div><div class="text-sm text-slate-600 mt-1.5 bg-slate-50/50 p-3 rounded-xl border border-slate-100 shadow-inner whitespace-pre-wrap font-medium leading-relaxed">${log.details}</div></div>`;
            });
            document.getElementById('histActionButtons').style.display = 'none'; document.getElementById('modalHistory').classList.remove('hidden');
        }

        // ================= 老師屬性與職別同步修改 =================
        function openTeacherModal(tId) {
            if (currentUserRole !== 'admin' || isPersonalView) { alert('權限不足：僅管理員可修改老師屬性。'); return; }
            state.selectedTarget.tId = tId; 
            const t = teachers.find(t => t.id === tId);
            state.selectedTarget.currentType = t.type;
            
            document.getElementById('teacherEditName').value = t.name || "";
            document.getElementById('teacherStartDate').value = t.startDate || "";
            document.getElementById('teacherHourlyRate').value = t.hourlyRate || "";
            const rateContainer = document.getElementById('hourlyRateInputContainer'); 
            if (t.type === 'fulltime' || t.type === 'responsible') { rateContainer.classList.add('hidden'); } else { rateContainer.classList.remove('hidden'); }
            document.getElementById('modalTeacher').classList.remove('hidden');
        }

        async function updateTeacherType(type) {
            document.getElementById('modalTeacher').classList.add('hidden'); 
            document.getElementById('loadingOverlay').classList.remove('hidden');
            
            let sDate = document.getElementById('teacherStartDate').value;
            if (!sDate) { sDate = null; }
            const rateVal = parseInt(document.getElementById('teacherHourlyRate').value);
            const newName = document.getElementById('teacherEditName').value.trim();
            const finalType = type === 'current' ? state.selectedTarget.currentType : type;

            const updatePayload = { type: finalType, start_date: sDate, hourly_rate: isNaN(rateVal) ? 0 : rateVal };
            if (newName) updatePayload.name = newName;

            await supabaseClient.from('teachers').update(updatePayload).eq('id', state.selectedTarget.tId);
            if (newName) await supabaseClient.from('users').update({ name: newName }).eq('id', state.selectedTarget.tId);
            
            await loadDataFromDB();
        }

        // ================= 薪資與防彈合規結算 =================
        function openSalaryTrackerModal() {
            const today = getTaiwanDateObj(); let year = today.getFullYear(), month = today.getMonth(); if (month === 0) { month = 12; year--; } 
            document.getElementById('salaryTargetMonth').value = `${year}-${String(month).padStart(2, '0')}`; document.getElementById('modalSalary').classList.remove('hidden'); renderSalaryTracker();
        }
        function renderSalaryTracker() {
            const targetMonth = document.getElementById('salaryTargetMonth').value; const tbody = document.getElementById('salaryTableBody'); tbody.innerHTML = '';
            if(!targetMonth) return; let grandTotalPayout = 0;
            teachers.filter(t => t.type === 'part_time').forEach(t => {
                let totalHours = 0;
                Object.keys(db).forEach(key => { const [dateStr, tId] = key.split('_'); if (tId === t.id && dateStr.startsWith(targetMonth)) { db[key].forEach(r => { if (r.status === 'active' && r.type === 'class') { totalHours += calcHoursFromTimeStr(r.exactTime); } }); } });
                const hourlyRate = t.hourlyRate || 0, calculatedSalary = totalHours * hourlyRate; grandTotalPayout += calculatedSalary;
                tbody.innerHTML += `<tr class="hover:bg-slate-50/50"><td class="p-4 font-black text-center text-base text-slate-800">${t.name}</td><td class="p-4 text-center text-slate-500 font-bold">NT$ ${hourlyRate} / 小時</td><td class="p-4 text-center text-indigo-500 font-black text-lg">${totalHours % 1 === 0 ? totalHours : totalHours.toFixed(1)} <span class="text-xs">小時</span></td><td class="p-4 text-center text-slate-800 font-black text-lg bg-indigo-50/30 tracking-wide">NT$ ${calculatedSalary.toLocaleString()}</td></tr>`;
            });
            if (tbody.innerHTML === '') tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-slate-400 font-bold tracking-widest uppercase">當前無兼職人員資料</td></tr>';
            document.getElementById('salaryTotalPayout').innerText = `NT$ ${grandTotalPayout.toLocaleString()}`;
        }
        
        function openFlexTrackerModal() {
            document.getElementById('modalFlex').classList.remove('hidden'); 
            const tbody = document.getElementById('flexTableBody'); 
            tbody.innerHTML = ''; 
            
            const targetTeachers = teachers.filter(t => t.type === 'fulltime' || t.type === 'responsible');
            
            if (targetTeachers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold tracking-widest uppercase">系統中目前無內部核心或負責人資料</td></tr>';
                return;
            }

            targetTeachers.forEach(t => {
                try {
                    const annualLeaveTotal = calcLsaAnnualLeave(t.startDate); 
                    
                    let periodStr = '不適用';
                    let maxRest = '-';
                    let periodInfo = null;

                    if ((t.type === 'fulltime' || t.type === 'responsible') && t.startDate) {
                        periodInfo = getIndividual8WeekPeriod(state.date, t.startDate);
                        if (periodInfo) {
                            periodStr = `${periodInfo.startStr} - ${periodInfo.endStr}`;
                            maxRest = periodInfo.maxRestDays;
                        } else { periodStr = '尚未達生效日'; }
                    }
                    
                    const stats = getLeaveStats(t.id, periodInfo ? periodInfo.start : null, periodInfo ? periodInfo.end : null);
                    
                    let seniorityStr = t.type === 'responsible' ? '不適用' : "未滿半年"; 
                    if(t.startDate && t.type !== 'responsible') { 
                        const s = new Date(t.startDate), n = getTaiwanDateObj(); 
                        let m = (n.getFullYear() - s.getFullYear()) * 12 + (n.getMonth() - s.getMonth()); 
                        if (n.getDate() < s.getDate()) m--; 
                        if(m >= 12) seniorityStr = `${Math.floor(m/12)}年${m%12}個月`; 
                        else if(m >= 0) seniorityStr = `${m}個月`; 
                    }
                    let tagInfo = t.type === 'responsible' ? `<span class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded text-[10px] ml-1 uppercase tracking-widest shadow-sm">負責人</span>` : '';
                    
                    const safeStatDays = stats.statDays || 0;
                    const displayStatDays = safeStatDays % 1 === 0 ? safeStatDays : safeStatDays.toFixed(2).replace(/\.00$/, '');
                    
                    const restHtml = (t.startDate && maxRest !== '-') 
                        ? `<div class="text-[10px] text-indigo-400 mb-1 font-bold tracking-widest uppercase">${periodStr}</div><div class="font-black text-xl text-indigo-600 tracking-wide">(${displayStatDays}/${maxRest})</div>` 
                        : '<span class="text-slate-300 font-bold">-</span>';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50/50 transition-colors">
                            <td class="p-4 font-black text-center text-base text-slate-800">${t.name || '未命名'} ${tagInfo}</td>
                            <td class="p-4 text-center">
                                <div class="font-bold text-slate-500 tracking-wide">${t.startDate || '未設定合約日'}</div>
                                <div class="text-[10px] text-indigo-600 font-black bg-indigo-50/80 inline-block px-2 py-0.5 rounded mt-1.5 border border-indigo-100/50 tracking-wider">${seniorityStr}</div>
                            </td>
                            <td class="p-4 text-center border-l bg-slate-50/50">${restHtml}</td>
                            <td class="p-4 text-center border-l font-black text-lg text-sky-500 tracking-wide">${formatQuota(stats.spec || 0, annualLeaveTotal || 0)}</td>
                            <td class="p-4 text-center font-black text-lg text-amber-500 tracking-wide">${formatQuota(stats.pers || 0, 14)}</td>
                            <td class="p-4 text-center font-black text-lg text-red-400 tracking-wide">${formatQuota(stats.sick || 0, 30)}</td>
                        </tr>`;
                } catch (error) {
                    console.error(`計算 ${t.name} 結算資料時發生錯誤:`, error);
                    tbody.innerHTML += `<tr><td colspan="6" class="p-4 text-center text-red-500 font-bold bg-red-50">⚠️ 系統無法計算 [${t.name}] 的休假狀態 (可能尚未填寫到職日)</td></tr>`;
                }
            });
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF排班日期,時段區塊,教師姓名,職務狀態,資料類型,開始時間,結束時間,課程名稱/假別,詳細事由,最新狀態\n";
            timeBlocks.forEach(b => { teachers.forEach(t => {
                const records = db[`${state.date}_${t.id}_${b}`] || [];
                records.forEach(r => { let st="", et=""; if(r.exactTime) { [st, et] = r.exactTime.split('-'); } else { st="00:00"; et="23:59"; }
                    csvContent += [state.date, b, t.name, t.type === 'fulltime' ? '內部' : (t.type === 'responsible' ? '負責人' : (t.type === 'external' ? '外聘' : '兼職')), r.type === 'class' ? '排課' : '休假', st, et, r.desc, r.reason || '無', r.status === 'active' ? '生效中' : '已取消'].map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",") + "\n";
                });
            }); });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `排班表_${state.date}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    </script>
</body>
</html>
